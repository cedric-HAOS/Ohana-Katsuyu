name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer ruff
        run: python -m pip install "ruff~=0.16.0"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

  tests:
    # Katsuyu is a Windows worker: its tests exercise the Windows code paths.
    name: Pytest (Python 3.13, Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet et ses dépendances de développement
        run: python -m pip install -e ".[development]"

      - name: pytest
        run: python -m pytest -q -ra

  commits:
    name: Messages de commit
    uses: cedric-HAOS/Ohana-Platform/.github/workflows/commit-messages.yml@main
